name: Build and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build universal app (same script as local builds)
        run: |
          chmod +x build.sh
          ./build.sh
          test -f build/XMRMenuCalc.app/Contents/Resources/MoneroChanFrames/meta.json
          lipo -info build/XMRMenuCalc.app/Contents/MacOS/XMRMenuCalc

      - name: Create DMG
        run: |
          brew install create-dmg
          mkdir -p release
          create-dmg \
            --volname "XMRMenuCalc" \
            --volicon "XMRMenuCalc/app_icon.icns" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --app-drop-link 450 185 \
            --icon "XMRMenuCalc.app" 150 185 \
            "release/XMRMenuCalc.dmg" \
            "build/XMRMenuCalc.app"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: XMRMenuCalc-dmg
          path: release/XMRMenuCalc.dmg

      - name: Upload macOS release asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/XMRMenuCalc.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev xorg-dev

      - name: Build Linux binary
        run: |
          cd linux
          go build -ldflags="-s -w" -o ../release/xmrmencalc-linux-amd64

      - name: Package Linux binary
        run: |
          mkdir -p release/xmrmencalc-linux
          cp release/xmrmencalc-linux-amd64 release/xmrmencalc-linux/xmrmencalc
          cp linux/xmr_logo.png release/xmrmencalc-linux/
          cp linux/README.md release/xmrmencalc-linux/ 2>/dev/null || echo "No linux README"
          cd release && tar czf xmrmencalc-linux-amd64.tar.gz xmrmencalc-linux

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: xmrmencalc-linux
          path: release/xmrmencalc-linux-amd64.tar.gz

      - name: Upload Linux release asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/xmrmencalc-linux-amd64.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
